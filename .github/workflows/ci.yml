name: AI Buddy CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ai-business-manager-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ai-buddy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build production application
        run: npm run build
